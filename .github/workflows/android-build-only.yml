name: Kodi 21.2 Android build-only trial

on:
  workflow_dispatch:
  push:
    branches: [main, 'experiment/**']
    # Editing workflow configuration alone should not launch another expensive build.
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: kodi-android-build-only
  cancel-in-progress: false

jobs:
  build:
    # ARM64 is the target architecture used by NVIDIA Shield TV.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      KODI_SOURCE: ${{ github.workspace }}/kodi
      KODI_DEPENDS_PREFIX: ${{ github.workspace }}/android-tools/xbmc-depends
      KODI_TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v4
        with:
          path: experiment

      - name: Check out Kodi 21.2 Omega
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: 21.2-Omega
          path: kodi
          submodules: recursive
          fetch-depth: 1

      # Reuse the expensive dependency outputs between hosted-runner jobs.
      # The key intentionally describes the stable Kodi/Android build environment,
      # not the experiment patch, so small patch edits do not invalidate it.
      - name: Restore Kodi dependency and CMake build cache
        uses: actions/cache@v4
        with:
          path: |
            kodi/tools/depends/target
            android-tools/xbmc-depends
            android-tools/xbmc-tarballs
            kodi-build
          key: kodi-21.2-omega-android-arm64-ndk21.4-deps-${{ github.run_id }}
          restore-keys: |
            kodi-21.2-omega-android-arm64-ndk21.4-deps-

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kodi-21.2-android-arm64-ccache-${{ github.run_id }}
          restore-keys: |
            kodi-21.2-android-arm64-ccache-

      - name: Apply experimental EDL AudioTrack mute patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 experiment/scripts/apply-edl-audiotrack-mute-experiment.py
          git -C kodi diff --check
          git -C kodi diff --stat

      - name: Reclaim unused hosted-runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          # Kodi's dependency build is large. Remove preinstalled toolchains
          # that this Android ARM64 build does not use; our SDK is installed
          # separately under ANDROID_SDK_ROOT.
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - name: Show runner and initial disk space
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          df -h
          free -h
          git -C "$KODI_SOURCE" rev-parse HEAD
          git -C "$KODI_SOURCE" describe --tags --always || true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential ccache curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip \
            zlib1g-dev patchelf p7zip-full

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK package "tools".
          # Install platform-tools here; the required SDK/NDK packages are installed below.
          packages: "platform-tools"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529"
          yes | sdkmanager --licenses || true
          ls -la "$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          # Kodi 21.2's configure script checks specifically for
          # cmdline-tools/latest/bin/sdkmanager. The current setup action
          # installs versioned cmdline-tools (for example, 16.0) instead.
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="$(command -v sdkmanager)"
            CMDLINE_TOOLS_DIR="$(dirname "$(dirname "$SDKMANAGER_PATH")")"
            ln -sfn "$CMDLINE_TOOLS_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Create debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --show-stats

      - name: Bootstrap and configure Kodi dependencies
        shell: bash
        working-directory: kodi/tools/depends
        run: |
          set -euxo pipefail
          ./bootstrap
          ./configure \
            --with-tarballs="$KODI_TARBALLS" \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/21.4.7075529" \
            --prefix="$KODI_DEPENDS_PREFIX"

      - name: Build Kodi dependencies
        shell: bash
        working-directory: kodi/tools/depends
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/experiment/build-diagnostics"
          echo "Disk space before dependency build:"
          df -h
          make -j2 > "$RUNNER_TEMP/kodi-depends-build.log" 2>&1
          result=$?
          tail -n 180 "$RUNNER_TEMP/kodi-depends-build.log"
          cp "$RUNNER_TEMP/kodi-depends-build.log" "$GITHUB_WORKSPACE/experiment/build-diagnostics/kodi-depends-build.log" || true
          echo "Disk space after dependency build:"
          df -h
          exit "$result"

      - name: Build binary add-ons
        shell: bash
        working-directory: kodi
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/experiment/build-diagnostics"
          echo "Disk space before binary add-ons:"
          df -h
          make -j2 -C tools/depends/target/binary-addons > "$RUNNER_TEMP/kodi-binary-addons-build.log" 2>&1
          result=$?
          tail -n 220 "$RUNNER_TEMP/kodi-binary-addons-build.log"
          cp "$RUNNER_TEMP/kodi-binary-addons-build.log" "$GITHUB_WORKSPACE/experiment/build-diagnostics/kodi-binary-addons-build.log" || true
          echo "Disk space after binary add-ons:"
          df -h
          exit "$result"

      - name: Configure Kodi CMake build
        shell: bash
        working-directory: kodi
        run: |
          set -euxo pipefail
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$BUILD_DIR"

      - name: Build Kodi
        shell: bash
        working-directory: kodi-build
        run: |
          set -euxo pipefail
          make -j2
          ccache --show-stats || true
          df -h

      - name: Package APK
        shell: bash
        working-directory: kodi-build
        run: |
          set -euxo pipefail
          make apk
          find "$KODI_SOURCE" "$BUILD_DIR" -type f -iname "*.apk" -print

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p experiment/build-diagnostics
          df -h > experiment/build-diagnostics/disk-space.txt || true
          free -h > experiment/build-diagnostics/memory.txt || true
          git -C "$KODI_SOURCE" rev-parse HEAD > experiment/build-diagnostics/kodi-commit.txt || true
          git -C "$KODI_SOURCE" status --short > experiment/build-diagnostics/kodi-status.txt || true
          find "$KODI_SOURCE" "$BUILD_DIR" -type f \( -name "CMakeError.log" -o -name "CMakeOutput.log" -o -name "config.log" -o -name "make.log" \) -print 2>/dev/null > experiment/build-diagnostics/log-file-list.txt || true
          while IFS= read -r logfile; do
            [ -f "$logfile" ] || continue
            mkdir -p "experiment/build-diagnostics/$(dirname "$logfile")"
            cp "$logfile" "experiment/build-diagnostics/$logfile" || true
          done < experiment/build-diagnostics/log-file-list.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-21.2-android-arm64-build-only
          path: |
            kodi/**/*.apk
            kodi-build/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-android-build-diagnostics
          path: experiment/build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
